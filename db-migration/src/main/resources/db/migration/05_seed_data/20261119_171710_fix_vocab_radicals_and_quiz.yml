databaseChangeLog:
  - changeSet:
      id: 20261119_171710_fix_vocab_radicals_and_quiz
      author: chinese-study
      comment: Cap nhat bo thu Kangxi, chiet tu va meo nho chuan cho 670 tu vung va 104 cau hoi bo thu
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |-
              UPDATE vocabularies SET radical = '子 (Tử) (Đứa con, trẻ nhỏ, người trí thức)', breakdown = '学: ⺍ + 冖 (Mịch: mái che) + 子 (Tử: trẻ nhỏ) • 校: 木 (Mộc: cây gỗ) + 交 (Giao: giao nhau)', mnemonic = 'Ghép 学 [bộ 子] + 校 [bộ 木] để nhớ từ 学校 (xuéxiào): "Trường học".' WHERE id = 'v1_1';
              UPDATE vocabularies SET radical = '老/耂 (Lão) (Người già, lâu năm, tôn kính)', breakdown = '老: 耂 (Lão: người già) + 匕 (Chủy) • 师: 𠂤 + 巾 (Cân: khăn vải)', mnemonic = 'Ghép 老 [bộ 耂] + 师 [bộ 巾] để nhớ từ 老师 (lǎoshī): "Giáo viên, thầy cô giáo".' WHERE id = 'v1_2';
              UPDATE vocabularies SET radical = '口 (Khẩu) (Miệng, ăn uống, lời nói, âm thanh phát ra)', breakdown = '同: 冂 (Quynh: khung bao) + 一 + 口 (Khẩu: cùng chung một tiếng) • 学: ⺍ + 冖 (Mịch: mái che) + 子 (Tử: trẻ nhỏ)', mnemonic = 'Ghép 同 [bộ 口] + 学 [bộ 子] để nhớ từ 同学 (tóngxué): "bạn học".' WHERE id = 'v1_3';
              UPDATE vocabularies SET radical = '子 (Tử) (Đứa con, trẻ nhỏ, người trí thức)', breakdown = '学: ⺍ + 冖 (Mịch: mái che) + 子 (Tử: trẻ nhỏ) • 生: Bộ 生 (Sinh - mầm cây nảy từ đất, chữ độc thể)', mnemonic = 'Ghép 学 [bộ 子] + 生 [bộ 生] để nhớ từ 学生 (xuésheng): "học sinh".' WHERE id = 'v1_4';
              UPDATE vocabularies SET radical = '田 (Điền) (Ruộng đất, khu vực, mặt)', breakdown = '留: 卯 (biến thể) + 田 (Điền: ruộng đất) • 学: ⺍ + 冖 (Mịch: mái che) + 子 (Tử: trẻ nhỏ) • 生: Bộ 生 (Sinh - mầm cây nảy từ đất, chữ độc thể)', mnemonic = 'Ghép 留 [bộ 田] + 学 [bộ 子] + 生 [bộ 生] để nhớ từ 留学生 (liúxuéshēng): "du học sinh".' WHERE id = 'v1_5';
              UPDATE vocabularies SET radical = '刀/刂 (Đao) (Con dao, cắt xẻ, phân chia)', breakdown = '刘 = 文 (Văn) + 刂 (Đao).', mnemonic = 'Chữ 刘 (Liú) mang nghĩa "Lưu (họ người)", bộ chính 刀/刂 (Đao); cấu tạo: 文 (Văn) + 刂 (Đao).' WHERE id = 'v1_6';
              UPDATE vocabularies SET radical = '艹 (Thảo) (Cỏ cây, hoa lá, thảo mộc)', breakdown = '范: 艹 (Thảo: cỏ) + 氵 (Thủy) + 卩 (Tiết) • 玉: Bộ 玉 (Ngọc - ba mảnh ngọc xâu dây kèm chấm, chữ độc thể) • 兰: 丷 (Bát) + 三 (Ba nét ngang)', mnemonic = 'Ghép 范 [bộ 艹] + 玉 [bộ 玉] + 兰 [bộ 八] để nhớ từ 范玉兰 (Fàn Yùlán): "Phạm Ngọc Lan".' WHERE id = 'v1_7';
              UPDATE vocabularies SET radical = '阝 (Phụ/Ấp) (Gò đất hoặc vùng đất, thành ấp)', breakdown = '阮: 阝 (Phụ: gò đất) + 元 (Nguyên) • 日: Bộ 日 (Nhật - mặt trời, chữ độc thể) • 明: 日 (Nhật: mặt trời) + 月 (Nguyệt: mặt trăng)', mnemonic = 'Ghép 阮 [bộ 阝] + 日 [bộ 日] + 明 [bộ 日] để nhớ từ 阮日明 (Ruǎn Rìmíng): "Nguyễn Nhật Minh".' WHERE id = 'v1_8';
              UPDATE vocabularies SET radical = '日 (Nhật) (Mặt trời, ban ngày, thời gian, ánh sáng)', breakdown = '早: 日 (Nhật: mặt trời mọc) + 十 (Thập: ngọn cây) • 上: Nét đứng 丨 và nét chấm chỉ hướng phía trên gạch ngang 一', mnemonic = 'Ghép 早 [bộ 日] + 上 [bộ 一] để nhớ từ 早上 (zǎoshang): "buổi sáng".' WHERE id = 'v1_9';
              UPDATE vocabularies SET radical = '丨 (Cổn) (Nét sổ thẳng, xuyên suốt)', breakdown = '中: 口 (Khẩu: khung vuông) + 丨 (Cổn: vạch chính giữa) • 午: 𠂉 + 十 (Thập)', mnemonic = 'Ghép 中 [bộ 丨] + 午 [bộ 十] để nhớ từ 中午 (zhōngwǔ): "buổi trưa".' WHERE id = 'v1_10';
              UPDATE vocabularies SET radical = '一 (Nhất) (Số một, nền tảng, nét ngang cơ bản)', breakdown = '下: Nét ngang 一 phía trên nét sổ 丨 và chấm chỉ hướng xuống dưới • 午: 𠂉 + 十 (Thập)', mnemonic = 'Ghép 下 [bộ 一] + 午 [bộ 十] để nhớ từ 下午 (xiàwǔ): "buổi chiều".' WHERE id = 'v1_11';
              UPDATE vocabularies SET radical = '日 (Nhật) (Mặt trời, ban ngày, thời gian, ánh sáng)', breakdown = '晚: 日 (Nhật: mặt trời) + 免 (Miễn: khuất bóng) • 上: Nét đứng 丨 và nét chấm chỉ hướng phía trên gạch ngang 一', mnemonic = 'Ghép 晚 [bộ 日] + 上 [bộ 一] để nhớ từ 晚上 (wǎnshàng): "buổi tối".' WHERE id = 'v1_12';
              UPDATE vocabularies SET radical = '日 (Nhật) (Mặt trời, ban ngày, thời gian, ánh sáng)', breakdown = '是 = 日 (Nhật: sáng rõ) + 𤴓 (biến thể của 正/疋: ngay thẳng).', mnemonic = 'Chữ 是 (shì) mang nghĩa "là, thì...", bộ chính 日 (Nhật); cấu tạo: 日 (Nhật: sáng rõ) + 𤴓 (biến thể của 正/疋: ngay thẳng).' WHERE id = 'v1_13';
              UPDATE vocabularies SET radical = '女 (Nữ) (Phụ nữ, gia đình, tình cảm)', breakdown = '好 = 女 (Nữ: người mẹ) + 子 (Tử: đứa con).', mnemonic = 'Chữ 好 (hǎo) mang nghĩa "tốt, khỏe, hay, ngon...", bộ chính 女 (Nữ); cấu tạo: 女 (Nữ: người mẹ) + 子 (Tử: đứa con).' WHERE id = 'v1_14';
              UPDATE vocabularies SET radical = '心/忄 (Tâm) (Trái tim, tình cảm, suy nghĩ, tâm lý)', breakdown = '您 = 你 (Nhĩ: bạn) + 心 (Tâm: đặt trong lòng để kính trọng).', mnemonic = 'Chữ 您 (nín) mang nghĩa "ngài, ông, bà... (cách gọi tôn trọng và lịch sự dành cho những người có địa vị cao...)", bộ chính 心/忄 (Tâm); cấu tạo: 你 (Nhĩ: bạn) + 心 (Tâm: đặt trong lòng để kính trọng).' WHERE id = 'v1_15';
              UPDATE vocabularies SET radical = '人/亻 (Nhân) (Con người, nhân loại, hành động)', breakdown = '你 = 亻 (Nhân đứng: người) + 尔 (Nhĩ).', mnemonic = 'Chữ 你 (nǐ) mang nghĩa "bạn, cậu, anh, chị... (ngôi thứ hai số ít)", bộ chính 人/亻 (Nhân); cấu tạo: 亻 (Nhân đứng: người) + 尔 (Nhĩ).' WHERE id = 'v1_16';
              UPDATE vocabularies SET radical = '人/亻 (Nhân) (Con người, nhân loại, hành động)', breakdown = '你: 亻 (Nhân đứng: người) + 尔 (Nhĩ) • 们: 亻 (Nhân đứng: người) + 门 (Môn: cửa)', mnemonic = 'Ghép 你 [bộ 亻] + 们 [bộ 亻] để nhớ từ 你们 (nǐmen): "các bạn, các anh, các chị… (ngôi thứ hai số nhiều)".' WHERE id = 'v1_17';
              UPDATE vocabularies SET radical = '戈 (Qua) (Cây giáo, vũ khí, chiến tranh)', breakdown = '我 = 手 (Thủ: tay biến thể) + 戈 (Qua: binh khí).', mnemonic = 'Chữ 我 (wǒ) mang nghĩa "tôi, tớ, mình... (ngôi thứ nhất số ít)", bộ chính 戈 (Qua); cấu tạo: 手 (Thủ: tay biến thể) + 戈 (Qua: binh khí).' WHERE id = 'v1_18';
              UPDATE vocabularies SET radical = '戈 (Qua) (Cây giáo, vũ khí, chiến tranh)', breakdown = '我: 手 (Thủ: tay biến thể) + 戈 (Qua: binh khí) • 们: 亻 (Nhân đứng: người) + 门 (Môn: cửa)', mnemonic = 'Ghép 我 [bộ 戈] + 们 [bộ 亻] để nhớ từ 我们 (wǒmen): "chúng ta, chúng mình, chúng tôi… (ngôi thứ nhất số nhiều)".' WHERE id = 'v1_19';
              UPDATE vocabularies SET radical = '口 (Khẩu) (Miệng, ăn uống, lời nói, âm thanh phát ra)', breakdown = '吗 = 口 (Khẩu: lời nói) + 马 (Mã: mượn âm).', mnemonic = 'Chữ 吗 (ma) mang nghĩa "à, ư, hả... (đặt ở cuối câu nghi vấn)", bộ chính 口 (Khẩu); cấu tạo: 口 (Khẩu: lời nói) + 马 (Mã: mượn âm).' WHERE id = 'v1_20';
              UPDATE vocabularies SET radical = '乙 (Ất) (Uốn cong, số thứ tự, chồi non)', breakdown = '也 = Bộ 乙 (Ất - nét uốn cong) + 丨 (chữ độc thể).', mnemonic = 'Chữ 也 (yě) mang nghĩa "cũng", bộ chính 乙 (Ất); cấu tạo: Bộ 乙 (Ất - nét uốn cong) + 丨 (chữ độc thể).' WHERE id = 'v1_21';
              UPDATE vocabularies SET radical = '贝 (Bối) (Vỏ sò, tiền bạc, giá trị)', breakdown = '贵: 中 (Trung biến thể) + 一 + 贝 (Bối: tiền bạc quý giá) • 姓: 女 (Nữ: mẹ) + 生 (Sinh: sinh ra dòng họ)', mnemonic = 'Ghép 贵 [bộ 贝] + 姓 [bộ 女] để nhớ từ 贵姓 (guìxìng): "họ, quý tính, quý danh (cách nói lịch sử)".' WHERE id = 'v2_1';
              UPDATE vocabularies SET radical = '女 (Nữ) (Phụ nữ, gia đình, tình cảm)', breakdown = '姓 = 女 (Nữ: mẹ) + 生 (Sinh: sinh ra dòng họ).', mnemonic = 'Chữ 姓 (xìng) mang nghĩa "họ, tính", bộ chính 女 (Nữ); cấu tạo: 女 (Nữ: mẹ) + 生 (Sinh: sinh ra dòng họ).' WHERE id = 'v2_2';
              UPDATE vocabularies SET radical = '口 (Khẩu) (Miệng, ăn uống, lời nói, âm thanh phát ra)', breakdown = '名: 夕 (Tịch: chiều tối) + 口 (Khẩu: gọi tên trong đêm) • 字: 宀 (Miên: mái nhà) + 子 (Tử: con cái, sinh sôi chữ nghĩa)', mnemonic = 'Ghép 名 [bộ 口] + 字 [bộ 子] để nhớ từ 名字 (míngzi): "tên".' WHERE id = 'v2_3';
              UPDATE vocabularies SET radical = '马 (Mã) (Con ngựa, chạy nhanh)', breakdown = '马: Bộ 马 (Mã - hình dáng con ngựa, chữ độc thể) • 克: 十 (Thập) + 口 (Khẩu) + 儿 (Nhi)', mnemonic = 'Ghép 马 [bộ 马] + 克 [bộ 儿] để nhớ từ 马克 (Mǎkè): "Mark (du học sinh Mỹ)".' WHERE id = 'v2_4';
              UPDATE vocabularies SET radical = '弓 (Cung) (Cây cung, độ căng, uốn cong)', breakdown = '张: 弓 (Cung: cây cung) + 长 (Trường: kéo dài dây cung) • 风: Bộ 风 (Phong - khung gió và nét phẩy chấm, chữ độc thể)', mnemonic = 'Ghép 张 [bộ 弓] + 风 [bộ 风] để nhớ từ 张风 (Zhāng Fēng): "Trương Phong (sinh viên người Trung Quốc đại học Thanh Hoa)".' WHERE id = 'v2_5';
              UPDATE vocabularies SET radical = '白 (Bạch) (Màu trắng, sáng tỏ)', breakdown = '白: Bộ 白 (Bạch - ánh sáng trắng, chữ độc thể) • 茹: 艹 (Thảo: cỏ cây) + 如 (Như) • 雪: 雨 (Vũ: mưa) + 彐 (Kệ: kết thành bông tuyết)', mnemonic = 'Ghép 白 [bộ 白] + 茹 [bộ 艹] + 雪 [bộ 雨] để nhớ từ 白茹雪 (Bái Rúxuě): "Bạch Như Tuyết (sinh viên người Trung Quốc đại học Bắc Kinh)".' WHERE id = 'v2_6';
              UPDATE vocabularies SET radical = '日 (Nhật) (Mặt trời, ban ngày, thời gian, ánh sáng)', breakdown = '明: 日 (Nhật: mặt trời) + 月 (Nguyệt: mặt trăng) • 天: 一 (Nhất: bầu trời cao) + 大 (Đại: con người dang tay)', mnemonic = 'Ghép 明 [bộ 日] + 天 [bộ 大] để nhớ từ 明天 (míngtiān): "ngày mai".' WHERE id = 'v2_7';
              UPDATE vocabularies SET radical = '玉/王 (Ngọc) (Đá quý, vua chúa)', breakdown = '现: 王 (Ngọc: viên ngọc sáng) + 见 (Kiến: nhìn thấy) • 在: 𠂇 + 土 (Thổ: tồn tại trên mặt đất)', mnemonic = 'Ghép 现 [bộ 王] + 在 [bộ 土] để nhớ từ 现在 (xiànzài): "hiện tại, bây giờ".' WHERE id = 'v2_8';
              UPDATE vocabularies SET radical = '女 (Nữ) (Phụ nữ, gia đình, tình cảm)', breakdown = '她 = 女 (Nữ: phụ nữ) + 也 (Dã).', mnemonic = 'Chữ 她 (tā) mang nghĩa "cô ấy, bà ấy, chị ấy,... (ngôi thứ ba số ít chỉ nữ)", bộ chính 女 (Nữ); cấu tạo: 女 (Nữ: phụ nữ) + 也 (Dã).' WHERE id = 'v2_9';
              UPDATE vocabularies SET radical = '人/亻 (Nhân) (Con người, nhân loại, hành động)', breakdown = '什: 亻 (Nhân đứng) + 十 (Thập) • 么: 丿 (Phiệt) + 厶 (Tư)', mnemonic = 'Ghép 什 [bộ 亻] + 么 [bộ 丿] để nhớ từ 什么 (shénme): "cái gì, gì".' WHERE id = 'v2_10';
              UPDATE vocabularies SET radical = '口 (Khẩu) (Miệng, ăn uống, lời nói, âm thanh phát ra)', breakdown = '叫 = 口 (Khẩu: miệng) + 丩 (Cưu: tiếng kêu).', mnemonic = 'Chữ 叫 (jiào) mang nghĩa "gọi, kêu", bộ chính 口 (Khẩu); cấu tạo: 口 (Khẩu: miệng) + 丩 (Cưu: tiếng kêu).' WHERE id = 'v2_11';
              UPDATE vocabularies SET radical = '一 (Nhất) (Số một, nền tảng, nét ngang cơ bản)', breakdown = '上: Nét đứng 丨 và nét chấm chỉ hướng phía trên gạch ngang 一 • 课: 讠 (Ngôn: lời giảng) + 果 (Quả: kết quả)', mnemonic = 'Ghép 上 [bộ 一] + 课 [bộ 讠] để nhớ từ 上课 (shàng kè): "vào học, lên lớp".' WHERE id = 'v2_12';
              UPDATE vocabularies SET radical = '见 (Kiến) (Nhìn thấy, gặp gỡ)', breakdown = '见 = Bộ 见 (Kiến - con mắt phía trên đôi chân, nhìn thấy).', mnemonic = 'Chữ 见 (jiàn) mang nghĩa "nhìn thấy, gặp", bộ chính 见 (Kiến); cấu tạo: Bộ 见 (Kiến - con mắt phía trên đôi chân, nhìn thấy).' WHERE id = 'v2_13';
              UPDATE vocabularies SET radical = '冂 (Quynh) (Vùng biên giới, khung bao)', breakdown = '再: 一 + 冂 (Quynh) + 土 (Thổ) • 见: Bộ 见 (Kiến - con mắt phía trên đôi chân, nhìn thấy)', mnemonic = 'Ghép 再 [bộ 冂] + 见 [bộ 见] để nhớ từ 再见 (zàijiàn): "tạm biệt, hẹn gặp lại".' WHERE id = 'v2_14';
              UPDATE vocabularies SET radical = '西/覀 (Tây) (Phương tây, che đậy)', breakdown = '要 = 覀 (Tây biến thể) + 女 (Nữ).', mnemonic = 'Chữ 要 (yào) mang nghĩa "phải", bộ chính 西/覀 (Tây); cấu tạo: 覀 (Tây biến thể) + 女 (Nữ).' WHERE id = 'v2_15';
              UPDATE vocabularies SET radical = '囗 (Vi) (Vây quanh, không gian kín, lãnh thổ)', breakdown = '回 = 囗 (Vi: vòng ngoài) + 口 (Khẩu: vòng trong, quay về).', mnemonic = 'Chữ 回 (huí) mang nghĩa "về, trở về, trở lại", bộ chính 囗 (Vi); cấu tạo: 囗 (Vi: vòng ngoài) + 口 (Khẩu: vòng trong, quay về).' WHERE id = 'v2_16';
              UPDATE vocabularies SET radical = '宀 (Miên) (Mái nhà, che chở, nơi ở)', breakdown = '宿: 宀 (Miên: mái nhà) + 亻 (Nhân) + 百 (Bách: trăm người nghỉ) • 舍: 人 (Nhân: mái chóp) + 舌 (Thiệt)', mnemonic = 'Ghép 宿 [bộ 宀] + 舍 [bộ 舌] để nhớ từ 宿舍 (sùshè): "ký túc xá".' WHERE id = 'v2_17';
              UPDATE vocabularies SET radical = '亅 (Quyết) (Nét móc đứng)', breakdown = '了 = Bộ 亅 (Quyết - nét móc kết thúc, chữ độc thể).', mnemonic = 'Chữ 了 (le) mang nghĩa "rồi", bộ chính 亅 (Quyết); cấu tạo: Bộ 亅 (Quyết - nét móc kết thúc, chữ độc thể).' WHERE id = 'v2_18';
              UPDATE vocabularies SET radical = '月 (Nguyệt/Nhục) (Mặt trăng hoặc các bộ phận thân thể người)', breakdown = '朋: 月 (Nguyệt) + 月 (Nguyệt: hai người kề vai) • 友: 𠂇 + 又 (Hựu: hai bàn tay nắm lấy nhau)', mnemonic = 'Ghép 朋 [bộ 月] + 友 [bộ 又] để nhớ từ 朋友 (péngyou): "bạn bè".' WHERE id = 'v3_1';
              UPDATE vocabularies SET radical = '人/亻 (Nhân) (Con người, nhân loại, hành động)', breakdown = '人 = Bộ 人 (Nhân - dáng người đứng bước, chữ độc thể).', mnemonic = 'Ghi nhớ chữ [人] (người, con người) qua hình tượng Con người, nhân loại.' WHERE id = 'v3_2';
              UPDATE vocabularies SET radical = '宀 (Miên) (Mái nhà, che chở, nơi ở)', breakdown = '安: 宀 (Miên: mái nhà) + 女 (Nữ: người phụ nữ bình yên trong nhà) • 妮: 女 (Nữ) + 尼 (Ni)', mnemonic = 'Ghép 安 [bộ 宀] + 妮 [bộ 女] để nhớ từ 安妮 (Ānnī): "Annie".' WHERE id = 'v3_3';
              UPDATE vocabularies SET radical = '囗 (Vi) (Vây quanh, không gian kín, lãnh thổ)', breakdown = '国: 囗 (Vi: biên giới) + 玉 (Ngọc: báu vật quốc gia) • 家: 宀 (Miên: mái nhà) + 豕 (Thỉ: lợn nuôi dưới mái nhà)', mnemonic = 'Ghép 国 [bộ 囗] + 家 [bộ 宀] để nhớ từ 国家 (guójiā): "quốc gia, đất nước".' WHERE id = 'v3_4';
