databaseChangeLog:
  - changeSet:
      id: 20261126_170501_seed_en_a2_lessons
      author: chinese-study
      comment: Nap lo trinh 45 bai hoc Tieng Anh CEFR A2 (1039 tu Word Atlas da dich Tieng Viet)
      runOnChange: true
      runInTransaction: false
      changes:
        - sqlFile:
            path: ../sql/seed_en_a2_data.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: true
            encoding: utf8
      rollback:
        - sql:
            dbms: postgresql
            sql: |-
              UPDATE lessons
              SET is_deleted = 1, deleted_at = NOW()
              WHERE language_code = 'en' AND id LIKE 'en-a2-%' AND is_deleted = 0;
