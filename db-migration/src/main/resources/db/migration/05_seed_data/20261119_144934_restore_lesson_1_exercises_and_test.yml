              INSERT INTO quiz_questions (id, lesson_id, text_id, scope, category, audio_text, passage, question, options, correct_index, explanation, sort_order) VALUES ('eq1_21', 'lesson-1', NULL, 'expanded_quiz', 'reading', NULL, NULL, '[Đọc hiểu mở rộng] Đọc đoạn hội thoại:
              Minh: 老师，早上好 (zǎoshang hǎo: chào buổi sáng)！您是刘老师吗？
              Thầy Lưu: 早上好 (zǎoshang hǎo: chào buổi sáng)！我是刘老师。你是阮日明吗？
              Minh: 是，我是阮日明，我是学校的 (de: của)新 (xīn: mới)留学生。
              Thầy Lưu: 欢迎 (huānyíng: chào mừng, chào đón)！范玉兰也是留学生吗？

              Theo đoạn hội thoại mở rộng trên, ai là giáo viên?', '["Nguyễn Nhật Minh","Thầy Lưu (刘老师)","Phạm Ngọc Lan","Một bạn học khác"]'::jsonb, 1, 'Trong bài, Nguyễn Nhật Minh hỏi và thầy xác nhận: ''我是刘老师''.', 21) ON CONFLICT (id) DO UPDATE SET lesson_id = EXCLUDED.lesson_id, category = EXCLUDED.category, question = EXCLUDED.question, options = EXCLUDED.options, correct_index = EXCLUDED.correct_index, explanation = EXCLUDED.explanation, sort_order = EXCLUDED.sort_order, is_deleted = 0, deleted_at = NULL;
