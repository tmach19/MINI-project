databaseChangeLog:
  - changeSet:
      id: 20261118_105000_create_translation_cache
      author: chinese-study
      comment: Tao bang translation_cache luu ket qua tra tu dien va dich AI Trung-Viet
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |-
              CREATE TABLE IF NOT EXISTS translation_cache (
                cache_key TEXT PRIMARY KEY,
                direction TEXT NOT NULL CHECK (direction IN ('auto', 'zh_vi', 'vi_zh')),
                query_text TEXT NOT NULL,
                source TEXT NOT NULL DEFAULT 'ai',
                model TEXT,
                payload JSONB NOT NULL,
                hit_count INTEGER NOT NULL DEFAULT 1,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );

              CREATE INDEX IF NOT EXISTS idx_translation_cache_updated
                ON translation_cache (updated_at DESC);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |-
              DROP TABLE IF EXISTS translation_cache;
