databaseChangeLog:
  - changeSet:
      id: 20261118_094500_create_rbac_tables
      author: chinese-study
      comment: Tao he thong bang phan quyen RBAC (roles, permissions, role_permissions, user_permissions) theo mo hinh ICDS
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |-
              CREATE TABLE IF NOT EXISTS roles (
                id TEXT PRIMARY KEY,
                code TEXT NOT NULL UNIQUE,
                name TEXT NOT NULL,
                description TEXT,
                is_system BOOLEAN NOT NULL DEFAULT TRUE,
                active_flg BOOLEAN NOT NULL DEFAULT TRUE,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );

              CREATE TABLE IF NOT EXISTS permissions (
                id TEXT PRIMARY KEY,
                code TEXT NOT NULL UNIQUE,
                name TEXT NOT NULL,
                type TEXT NOT NULL CHECK (type IN ('MENU', 'ACTION')),
                parent_code TEXT,
                description TEXT,
                sort_order INTEGER NOT NULL DEFAULT 0,
                active_flg BOOLEAN NOT NULL DEFAULT TRUE,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );

              CREATE TABLE IF NOT EXISTS role_permissions (
                role_id TEXT NOT NULL REFERENCES roles(id) ON DELETE CASCADE,
                permission_id TEXT NOT NULL REFERENCES permissions(id) ON DELETE CASCADE,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                PRIMARY KEY (role_id, permission_id)
              );

              CREATE TABLE IF NOT EXISTS user_permissions (
                user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                permission_id TEXT NOT NULL REFERENCES permissions(id) ON DELETE CASCADE,
                is_excluded BOOLEAN NOT NULL DEFAULT FALSE,
                updated_by UUID REFERENCES users(id) ON DELETE SET NULL,
                updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                PRIMARY KEY (user_id, permission_id)
              );

              CREATE INDEX IF NOT EXISTS idx_permissions_sort ON permissions (sort_order, code);
              CREATE INDEX IF NOT EXISTS idx_role_permissions_role ON role_permissions (role_id);
              CREATE INDEX IF NOT EXISTS idx_user_permissions_user ON user_permissions (user_id, is_excluded);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |-
              DROP TABLE IF EXISTS user_permissions;
              DROP TABLE IF EXISTS role_permissions;
              DROP TABLE IF EXISTS permissions;
              DROP TABLE IF EXISTS roles;
